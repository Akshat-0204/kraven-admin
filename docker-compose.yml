# Local infrastructure for the Kraven API: object storage (MinIO) and HTML->PDF rendering (Gotenberg).
# Start with: docker compose up -d
# MongoDB is expected to run separately (see apps/api/.env.example -> MONGODB_URI).
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    # SSRF guard: Chromium must not fetch loopback, private (RFC 1918), link-local/metadata (169.254.x),
    # IPv6 literals or the internal compose hosts referenced from template HTML. The regex replaces
    # Gotenberg's default deny list, so the default `file:` rule (only /tmp allowed) is kept in it.
    # Chromium canonicalises hosts (lowercase, dotted IPv4) before Gotenberg matches the URL.
    command:
      - gotenberg
      - '--chromium-deny-list=^(file:(?!//\/tmp/)|[a-z][a-z0-9+.-]*://([^/@]*@)?(([^/@:]*\.)?localhost(:|/|$)|127\.|0\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|\[|(minio|mongo|mongodb|gotenberg|api|host\.docker\.internal)(:|/|$))).*'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  minio-data:
